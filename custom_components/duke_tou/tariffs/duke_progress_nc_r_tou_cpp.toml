# Duke Energy Progress (North Carolina) Schedule R-TOU-CPP
# NC Second Revised Leaf No. 503, effective for service on and after 2025-10-01.
# https://www.duke-energy.com/-/media/pdfs/for-your-home/rates/dep-nc/leaf-no-503-schedule-r-tou-cpp.pdf
#
# To change a tariff, copy it to <home assistant config>/duke_tou/ under the same
# file name and edit the copy; it is used instead of the bundled one. Reload the
# integration afterwards. Tier names are fixed: critical_peak, on_peak, off_peak,
# discount. A file with a different name there shows up as an extra plan choice.

name = "Duke Energy R-TOU-CPP"

# Billed for every hour no period matches. Top-level keys must stay above the
# first [table], or TOML files them under that table.
default_tier = "off_peak"

# Energy charges in cents per kWh. The integration's Configure dialog can override them.
[rates]
critical_peak = 41.002
on_peak = 21.952
off_peak = 11.000
discount = 8.274

# Each month belongs to exactly one season.
[seasons]
summer = [5, 6, 7, 8, 9]
non_summer = [10, 11, 12, 1, 2, 3, 4]

# Periods in order of precedence: the first one that matches an hour wins.
# days: "all", "weekdays", or "weekdays_no_holidays".
# hours: [start, end) in local clock hours, 0-24, per season.
[[periods]]
tier = "on_peak"
days = "weekdays_no_holidays"
hours = { summer = [[18, 21]], non_summer = [[6, 9]] }

[[periods]]
tier = "discount"
days = "all"
hours = { summer = [[1, 6]], non_summer = [[1, 3], [11, 16]] }

# On a day you flag, the hours of the `replaces` period are billed as critical peak.
[critical_peak]
replaces = "on_peak"
max_shift_hours = 1     # Duke may move the window this many hours earlier or later
days_per_year = 20      # informational; Duke may exceed it in a system emergency

# observed: "nearest_weekday" moves a Saturday holiday to the Friday before and a
# Sunday holiday to the Monday after; "none" leaves dates alone.
[holidays]
observed = "nearest_weekday"
rules = [
  { name = "New Year's Day", month = 1, day = 1 },
  { name = "Good Friday", easter_offset = -2 },
  { name = "Memorial Day", month = 5, weekday = "mon", nth = -1 },
  { name = "Independence Day", month = 7, day = 4 },
  { name = "Labor Day", month = 9, weekday = "mon", nth = 1 },
  { name = "Thanksgiving Day", month = 11, weekday = "thu", nth = 4 },
  { name = "Day after Thanksgiving", after = "Thanksgiving Day", days = 1 },
  { name = "Christmas Day", month = 12, day = 25 },
]
